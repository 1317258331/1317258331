<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">罗志翔 — Frontend Developer</title>
  <desc id="heroDesc">Midnight aurora banner with a serif name, a short tagline, technology chips and a terminal card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050810"/>
      <stop offset="0.48" stop-color="#080D18"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 92) rotate(126) scale(350 280)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 350) rotate(-35) scale(420 300)">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="auroraA" x1="120" y1="80" x2="1060" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraB" x1="260" y1="390" x2="930" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#2DD4BF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="80" y1="140" x2="420" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FB"/>
      <stop offset="0.58" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#9DE7F5"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="760" y1="96" x2="1120" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A101C" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="760" y1="96" x2="1120" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="760" y1="60" x2="1140" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="fadeMask" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.05"/>
      <stop offset="0.24" stop-color="white" stop-opacity="0.5"/>
      <stop offset="0.72" stop-color="white" stop-opacity="0.34"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#93C5FD" stroke-opacity="0.13" stroke-width="0.6"/>
    </pattern>

    <mask id="gridFade">
      <rect width="1200" height="420" fill="url(#fadeMask)"/>
    </mask>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#22D3EE" flood-opacity="0.08"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="760" y="96" width="360" height="228" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glowViolet)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" mask="url(#gridFade)"/>

  <g class="aurora" opacity="0.9">
    <path d="M-40 96C182 18 320 338 590 254C810 186 962 58 1240 138" stroke="url(#auroraA)" stroke-width="104" stroke-linecap="round" filter="url(#softBlur)"/>
    <path d="M110 402C314 326 448 470 646 356C820 256 930 128 1168 84" stroke="url(#auroraB)" stroke-width="72" stroke-linecap="round" filter="url(#softBlur)"/>
  </g>

  <g class="orbit" stroke="url(#orbitGrad)" fill="none">
    <circle cx="948" cy="210" r="142" stroke-opacity="0.5"/>
    <circle cx="948" cy="210" r="188" stroke-opacity="0.28" stroke-dasharray="2 9"/>
    <circle cx="948" cy="210" r="238" stroke-opacity="0.14"/>
    <circle cx="948" cy="210" r="286" stroke-opacity="0.08"/>
  </g>

  <g fill="#DDF6FF">
    <circle class="star s1" cx="640" cy="62" r="1.6" opacity="0.55"/>
    <circle class="star s2" cx="704" cy="118" r="1.2" opacity="0.4"/>
    <circle class="star s3" cx="596" cy="176" r="1.8" opacity="0.5"/>
    <circle class="star s4" cx="682" cy="248" r="1.3" opacity="0.34"/>
    <circle class="star s5" cx="588" cy="330" r="1.5" opacity="0.42"/>
    <circle class="star s6" cx="720" cy="354" r="1.1" opacity="0.34"/>
    <circle class="star s7" cx="1082" cy="346" r="1.7" opacity="0.48"/>
    <circle class="star s8" cx="1146" cy="302" r="1.2" opacity="0.38"/>
    <circle class="star s9" cx="1114" cy="118" r="1.4" opacity="0.4"/>
    <circle class="star s10" cx="1042" cy="56" r="1.8" opacity="0.52"/>
    <circle class="star s11" cx="540" cy="88" r="1.1" opacity="0.3"/>
    <circle class="star s12" cx="466" cy="334" r="1.4" opacity="0.34"/>
    <circle class="star s13" cx="440" cy="62" r="1.7" opacity="0.44"/>
    <circle class="star s14" cx="368" cy="116" r="1.1" opacity="0.26"/>
    <circle class="star s15" cx="760" cy="386" r="1.3" opacity="0.32"/>
  </g>

  <g font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace">
    <g>
      <circle class="pulse" cx="84" cy="74" r="3.5" fill="#5EEAD4"/>
      <circle cx="84" cy="74" r="7" stroke="#5EEAD4" stroke-opacity="0.24"/>
      <text x="102" y="78" fill="#8FA3BD" font-size="11" letter-spacing="3.6">PORTFOLIO / 2026</text>
    </g>

    <text x="1120" y="78" text-anchor="end" fill="#71839D" font-size="10" letter-spacing="3.2">FRONTEND · DESIGN · MOTION</text>
  </g>

  <text x="78" y="198" fill="url(#nameGrad)" font-family="'Songti SC','Noto Serif SC',Georgia,'Times New Roman',serif" font-size="88" letter-spacing="4">罗志翔</text>
  <text x="82" y="232" fill="#97AAC3" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="12" letter-spacing="8.5">LUO ZHIXIANG</text>

  <text x="82" y="290" fill="#EEF3F9" font-family="'Songti SC','Noto Serif SC',Georgia,'Times New Roman',serif" font-size="22" letter-spacing="0.6">在前端世界里，打磨有秩序的美。</text>
  <text x="82" y="316" fill="#8FA0B8" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="12" letter-spacing="0.4">Crafting calm, expressive interfaces for the web.</text>

  <g font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="11.5">
    <g>
      <rect x="80" y="346" width="70" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="115" y="369" text-anchor="middle" fill="#CFE2F2">Vue 3</text>
    </g>
    <g>
      <rect x="160" y="346" width="96" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="208" y="369" text-anchor="middle" fill="#CFE2F2">TypeScript</text>
    </g>
    <g>
      <rect x="266" y="346" width="86" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="309" y="369" text-anchor="middle" fill="#CFE2F2">Electron</text>
    </g>
    <g>
      <rect x="362" y="346" width="54" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="389" y="369" text-anchor="middle" fill="#CFE2F2">Vite</text>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="760" y="96" width="360" height="228" rx="20" fill="url(#cardGrad)" stroke="url(#cardBorder)"/>
  </g>

  <g clip-path="url(#cardClip)">
    <path d="M760 96H1120V190C1030 162 928 146 820 174C790 182 772 190 760 196V96Z" fill="#22D3EE" fill-opacity="0.035"/>
    <path d="M760 96L1120 324" stroke="#FFFFFF" stroke-opacity="0.04"/>
  </g>

  <g>
    <circle cx="786" cy="122" r="4" fill="#FB7185"/>
    <circle cx="800" cy="122" r="4" fill="#FBBF24"/>
    <circle cx="814" cy="122" r="4" fill="#2DD4BF"/>
    <line x1="760" y1="138" x2="1120" y2="138" stroke="#FFFFFF" stroke-opacity="0.07"/>
  </g>

  <g font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="12.5">
    <text x="790" y="168" fill="#5EEAD4">$ whoami</text>
    <text x="790" y="192" fill="#E6EEF8" font-size="13.5">luo zhixiang</text>

    <text x="790" y="226" fill="#5EEAD4">$ stack</text>
    <text x="790" y="250" fill="#E6EEF8" font-size="13.5">Vue · TypeScript · Electron</text>

    <text x="790" y="284" fill="#5EEAD4">$ motto</text>
    <text x="790" y="308" fill="#C4B5FD" font-size="13.5">clarity &gt; cleverness</text>
    <rect class="cursor" x="958" y="295" width="7" height="16" rx="1.5" fill="#5EEAD4"/>
  </g>

  <line x1="80" y1="390" x2="1120" y2="390" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="80" y="408" fill="#64748B" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="9.5" letter-spacing="2.8">BEIJING · UTC+8</text>
  <text x="1120" y="408" text-anchor="end" fill="#64748B" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="9.5" letter-spacing="2.8">ALWAYS CURIOUS</text>

  <style>
    .aurora { animation: drift 18s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .orbit { animation: breathe 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    .cursor { animation: blink 1.35s steps(1,end) infinite; }
    .s1,.s5,.s9,.s13 { animation: twinkle 5.2s ease-in-out infinite; }
    .s2,.s6,.s10,.s14 { animation: twinkle 6.4s ease-in-out 1.1s infinite; }
    .s3,.s7,.s11,.s15 { animation: twinkle 7.2s ease-in-out 2.2s infinite; }
    .s4,.s8,.s12 { animation: twinkle 5.8s ease-in-out 0.7s infinite; }

    @keyframes drift {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      50% { transform: translate3d(-16px,9px,0) scale(1.025); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.72; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.012); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.72; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aurora, .orbit, .pulse, .cursor, .star { animation: none; }
    }
  </style>
</svg>
