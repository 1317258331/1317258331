<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w3Title w3Desc">
  <title id="w3Title">Open Source Map</title>
  <desc id="w3Desc">A curated map of starred repositories and inspiration.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="0" x2="310" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18150F"/>
      <stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(278 20) rotate(134) scale(155 135)">
      <stop stop-color="#FBBF24" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="319" height="199" rx="18" fill="url(#bg)" stroke="url(#border)"/>
  <rect x="0.5" y="0.5" width="319" height="199" rx="18" fill="url(#glow)"/>
  <text x="296" y="182" text-anchor="end" fill="#FBBF24" fill-opacity="0.05" font-family="Georgia,serif" font-size="92">03</text>

  <text x="24" y="32" fill="#FBBF24" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="8.5" letter-spacing="2.2">03 / INSPIRATION</text>
  <g stroke="#FBBF24" stroke-opacity="0.52" stroke-width="1.1" stroke-linecap="round">
    <path d="M267 36L271 27L275 36L284 40L275 44L271 53L267 44L258 40L267 36Z"/>
    <circle cx="286" cy="25" r="1.3" fill="#FBBF24" stroke="none"/>
  </g>

  <text x="24" y="76" fill="#EDF4FB" font-family="'Baskerville','Songti SC',Georgia,serif" font-size="24">Open Source Map</text>
  <text x="24" y="98" fill="#7F93AB" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="9" letter-spacing="0.8">STARRED / CURATED</text>

  <text x="24" y="130" fill="#B7C5D7" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5">一份持续生长的灵感地图：</text>
  <text x="24" y="148" fill="#B7C5D7" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5">关于工具、设计与好代码。</text>

  <circle cx="27" cy="176" r="2.4" fill="#FBBF24"/>
  <text x="36" y="179" fill="#7488A0" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="8.5" letter-spacing="1.2">CURATED LIST</text>
  <path d="M276 175H287M282 170L287 175L282 180" stroke="#8399B1" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
