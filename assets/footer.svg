    <text x="600" y="82" text-anchor="middle" fill="#768AA3" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="8.5" letter-spacing="3.6">A QUIET MANIFESTO</text>
  </g>

  <text x="600" y="121" text-anchor="middle" fill="#E9F0F8" font-family="'Songti SC','Noto Serif SC',Georgia,'Times New Roman',serif" font-size="30" letter-spacing="1.2">让界面有呼吸，让代码有分寸。</text>

  <line x1="470" y1="148" x2="730" y2="148" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="600" y="168" text-anchor="middle" fill="#5F728B" font-family="'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,monospace" font-size="8.5" letter-spacing="3">THANKS FOR VISITING · 罗志翔 · BEIJING</text>
